<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchMind — Ask anything. Search the web. Get verified answers.</title>
    <meta name="description" content="SearchMind: AI-powered web search with verified answers.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-deep: #050508;
            --bg-surface: rgba(10, 10, 16, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.02);
            --bg-glass-hover: rgba(255, 255, 255, 0.06);
            --border-glass: rgba(255, 255, 255, 0.06);
            --border-glass-hover: rgba(255, 255, 255, 0.12);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.22);
            --accent-soft: rgba(139, 92, 246, 0.08);
            --accent-2: #a78bfa;
            --accent-3: #c084fc;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
        }
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Moving Glassmorphic Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.16;
            pointer-events: none;
            transition: all 1s ease;
        }
        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            animation: float1 25s infinite alternate;
        }
        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, var(--accent-3) 0%, transparent 70%);
            animation: float2 30s infinite alternate;
        }
        .blob-3 {
            top: 40%;
            left: 45%;
            width: 35vw;
            height: 35vw;
            background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
            animation: float3 20s infinite alternate;
        }

        @keyframes float1 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(8vw, 12vh) scale(1.1); }
            100% { transform: translate(-4vw, 4vh) scale(0.9); }
        }
        @keyframes float2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-6vw, -10vh) scale(0.95); }
            100% { transform: translate(3vw, -3vh) scale(1.05); }
        }
        @keyframes float3 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-10vw, 6vh) scale(1.15); }
            100% { transform: translate(6vw, -8vh) scale(0.85); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

        /* Layout */
        .app-layout { display: flex; height: 100vh; position: relative; z-index: 1; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: rgba(10, 10, 16, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .sidebar-header {
            padding: 20px 20px 14px;
            border-bottom: 1px solid var(--border-glass);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .brand-name {
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.2px;
        }
        .logout-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius-sm);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.15);
            transform: scale(1.05);
        }
        .logout-btn:active {
            transform: scale(0.95);
        }

        /* Premium Glass Button - New Chat */
        .btn-glass {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 4px 24px rgba(0, 0, 0, 0.15);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(139, 92, 246, 0.35);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 0 24px rgba(139, 92, 246, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .btn-glass:active {
            transform: translateY(0.5px) scale(0.98);
        }

        /* Chat history items */
        .chat-item {
            padding: 12px 16px;
            cursor: pointer;
            border-radius: var(--radius-md);
            margin: 4px 12px;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-item::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: transparent;
            transition: all 0.25s ease;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .chat-item.active {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.25);
            color: var(--text-primary);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }
        .chat-item.active::before {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .sidebar-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-glass);
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ===== MAIN AREA ===== */
        .main-area { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

        /* Chat thread */
        .chat-thread { flex: 1; overflow-y: auto; padding: 24px 0; }
        .chat-thread.hidden { display: none; }

        /* Input bar */
        .input-bar {
            border-top: 1px solid var(--border-glass);
            background: rgba(10, 10, 16, 0.5);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            padding: 20px 24px;
        }
        .input-wrapper {
            max-width: 768px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-field {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-xl);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            min-height: 48px;
            max-height: 120px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.02), 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .input-field::placeholder { color: var(--text-muted); }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 0 0 3px var(--accent-glow);
        }

        /* Send button - glowing glassy accent */
        .send-btn {
            min-width: 48px;
            min-height: 48px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(192, 132, 252, 0.3));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .send-btn:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.55), rgba(192, 132, 252, 0.45));
            border-color: rgba(139, 92, 246, 0.6);
            transform: translateY(-1.5px);
            box-shadow: 0 12px 32px rgba(139, 92, 246, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }
        .send-btn:active {
            transform: translateY(0.5px) scale(0.95);
        }
        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== USER BUBBLE ===== */
        .user-bubble {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(168, 85, 247, 0.15));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: var(--radius-xl) var(--radius-xl) 6px var(--radius-xl);
            padding: 14px 20px;
            max-width: 75%;
            margin-left: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* ===== AI RESPONSE CARD - Glassmorphism ===== */
        .ai-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-xl);
            padding: 24px;
            max-width: 85%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .ai-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        /* Source chips */
        .sources-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
        .source-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
        .source-chip:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(139, 92, 246, 0.35);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.1);
        }

        /* Confidence badge */
        .confidence-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Error card */
        .error-card {
            background: rgba(248,113,113,0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(248,113,113,0.15);
            border-radius: var(--radius-md);
            padding: 16px;
            color: var(--danger);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        /* Typing indicator */
        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse-bounce 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-10px); opacity: 1; }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(139,92,246,0.1); }
        }
        .animate-in { animation: fadeSlideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-scale { animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* ===== AUTH SCREEN ===== */
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            z-index: 1;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 0 24px;
        }
        .auth-logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-weight: 700;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 0 40px var(--accent-glow);
            animation: glowPulse 3s infinite;
        }
        .auth-title {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }
        .auth-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-form-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-2xl);
            padding: 36px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }
        .auth-form-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .auth-error {
            display: none;
            margin-bottom: 16px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.2);
            color: var(--danger);
            font-size: 13px;
        }
        .auth-error.visible { display: block; }
        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .auth-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .auth-input::placeholder { color: var(--text-muted); }
        .auth-input:focus {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Primary glowing glassy button */
        .btn-glow {
            width: 100%;
            padding: 12px 18px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(192, 132, 252, 0.3));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: 0.5s;
        }
        .btn-glow:hover::before {
            left: 100%;
        }
        .btn-glow:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.55), rgba(192, 132, 252, 0.45));
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .btn-glow:active {
            transform: translateY(0.5px) scale(0.98);
        }

        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-toggle button {
            background: none;
            border: none;
            color: var(--accent-2);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.25s ease;
        }
        .auth-toggle button:hover {
            color: var(--accent-3);
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.4);
        }

        /* ===== WELCOME SCREEN ===== */
        .welcome-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        .welcome-wrapper.hidden { display: none; }
        .welcome-logo {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-3));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: 700;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 0 40px var(--accent-glow);
            animation: glowPulse 4s infinite;
        }
        .welcome-title {
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .welcome-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        /* Suggestion cards */
        .suggestion-card {
            width: 100%;
            text-align: left;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            font-size: 13.5px;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.03), 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .suggestion-card::after {
            content: '→';
            font-size: 16px;
            color: var(--accent-2);
            opacity: 0;
            transform: translateX(-5px);
            transition: all 0.3s ease;
        }
        .suggestion-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(139, 92, 246, 0.3);
            color: var(--text-primary);
            transform: translateY(-3px);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08), 0 8px 32px rgba(139, 92, 246, 0.12);
        }
        .suggestion-card:hover::after {
            opacity: 1;
            transform: translateX(0);
        }
        .suggestion-card:active {
            transform: translateY(-0.5px) scale(0.99);
        }

        /* Mobile */
        .mobile-toggle { display: none !important; }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                z-index: 50;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar.open { left: 0; }
            .mobile-toggle {
                display: flex !important;
                position: fixed;
                top: 14px;
                left: 14px;
                z-index: 50;
                padding: 10px;
                border-radius: var(--radius-md);
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                cursor: pointer;
                transition: all 0.2s;
            }
            .mobile-toggle:hover {
                background: rgba(255, 255, 255, 0.06);
                border-color: rgba(255, 255, 255, 0.15);
            }
            .mobile-toggle:active {
                transform: scale(0.95);
            }
        }

        /* Utility hidden */
        .hidden { display: none !important; }

        /* Divider */
        .divider { border-top: 1px solid var(--border-glass); }
    </style>
</head>
<body>

<!-- BLOB BACKGROUNDS -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- AUTH SCREEN -->
<div id="authScreen" class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">S</div>
        <h1 class="auth-title">SearchMind</h1>
        <p class="auth-subtitle">Ask anything. Search the web. Get verified answers.</p>

        <div class="auth-form-card animate-scale">
            <h2 id="authTitle" class="auth-form-title">Sign In</h2>
            <div id="authError" class="auth-error"></div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input id="authEmail" type="email" placeholder="you@example.com" class="auth-input" autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input id="authPassword" type="password" placeholder="••••••••" class="auth-input" autocomplete="current-password">
            </div>

            <button id="authSubmitBtn" class="btn-glow" onclick="handleAuth()">Sign In</button>

            <div class="auth-toggle">
                <span id="authToggleText">Don't have an account?</span>
                <button id="authToggleBtn" onclick="toggleAuthMode()"> Sign Up</button>
            </div>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="appScreen" class="app-layout hidden">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div class="brand-logo">S</div>
                    <span class="brand-name">SearchMind</span>
                </div>
                <button onclick="handleLogout()" title="Sign out" class="logout-btn" aria-label="Sign out">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
            <button id="newChatBtn" class="btn-glass" aria-label="Start new chat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Chat
            </button>
        </div>
        <div style="flex:1;overflow-y:auto;padding:6px 0;" id="historyList"></div>
        <div class="sidebar-footer">
            <div id="userInfo" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
        </div>
    </aside>

    <main class="main-area">
        <button class="mobile-toggle" style="position:fixed;top:12px;left:12px;z-index:50;padding:8px;border-radius:var(--radius-sm);background:var(--bg-glass);border:1px solid var(--border-glass);cursor:pointer;" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <button id="debugToggleBtn" class="debug-toggle" style="position:fixed;top:12px;right:12px;z-index:50;padding:8px 12px;border-radius:var(--radius-sm);background:var(--bg-glass);border:1px solid var(--border-glass);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;" onclick="toggleDebugPanel()" aria-label="Toggle debug panel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
            <span style="font-size:12px;color:var(--text-primary);font-weight:500;">Debug Mode</span>
        </button>

        <!-- DEBUG INSPECTION PANEL -->
        <div id="debugDrawer" style="position:fixed;top:0;right:-450px;width:450px;max-width:100%;height:100vh;background:rgba(5, 5, 8, 0.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-left:1px solid var(--border-glass);z-index:100;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,0.5);transition:right 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
            <div style="padding:16px 20px;border-bottom:1px solid var(--border-glass);display:flex;align-items:center;justify-content:space-between;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);"></span>
                    <span style="font-weight:600;font-size:14px;letter-spacing:0.5px;color:var(--text-primary);">PIPELINE INSPECTOR</span>
                </div>
                <button onclick="toggleDebugPanel()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:4px;transition:all 0.2s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-muted)'" aria-label="Close debug panel">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="debugPanel" style="flex:1;overflow-y:auto;padding:20px;font-family:'JetBrains Mono', monospace;font-size:12px;line-height:1.6;color:#a78bfa;white-space:pre-wrap;">
                <div style="color:var(--text-muted);text-align:center;margin-top:100px;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 12px;opacity:0.5;"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                    <p>No query executed yet.</p>
                    <p style="font-size:11px;margin-top:4px;">Execute a search in Debug Mode to trace pipeline steps.</p>
                </div>
            </div>
        </div>

        <div id="welcomeScreen" class="welcome-wrapper">
            <div style="max-width:480px;padding:0 24px;">
                <div class="welcome-logo">S</div>
                <h2 class="welcome-title">Welcome to SearchMind</h2>
                <p class="welcome-subtitle">Ask anything. Search the web. Get verified answers.</p>
                <div style="display:flex;flex-direction:column;gap:10px;">
                    <button class="suggestion-card" onclick="useSuggestion(this.textContent)">What are the latest breakthroughs in AI?</button>
                    <button class="suggestion-card" onclick="useSuggestion(this.textContent)">Explain quantum computing in simple terms</button>
                    <button class="suggestion-card" onclick="useSuggestion(this.textContent)">What is the current state of space exploration?</button>
                </div>
            </div>
        </div>

        <div id="chatThread" class="chat-thread hidden">
            <div id="messages" style="max-width:768px;margin:0 auto;padding:0 24px;"></div>
        </div>

        <div class="input-bar">
            <div class="input-wrapper">
                <textarea id="messageInput" rows="1" placeholder="Ask anything..." class="input-field" maxlength="2000" oninput="autoResize(this)"></textarea>
                <button id="sendBtn" class="send-btn" aria-label="Send message" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
    </main>
</div>

<script>
// --- State ---
let authToken = localStorage.getItem('sm_token') || '';
let userEmail = localStorage.getItem('sm_email') || '';
let currentSessionId = crypto.randomUUID();
let isLoading = false;
let typingInterval = null;
let isLoginMode = true;
let debugModeEnabled = false;

// --- DOM refs ---
const authScreen = document.getElementById('authScreen');
const appScreen = document.getElementById('appScreen');
const welcomeScreen = document.getElementById('welcomeScreen');
const chatThread = document.getElementById('chatThread');
const msgContainer = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const historyList = document.getElementById('historyList');
const newChatBtn = document.getElementById('newChatBtn');

function toggleDebugPanel() {
    const panel = document.getElementById('debugDrawer');
    const btn = document.getElementById('debugToggleBtn');
    
    // Explicitly check current visual state of the drawer
    const isOpen = panel && panel.style.right === '0px';
    
    if (!isOpen) {
        debugModeEnabled = true;
        if (panel) panel.style.right = '0px';
        if (btn) {
            btn.style.borderColor = 'var(--accent)';
            btn.style.background = 'rgba(139, 92, 246, 0.15)';
            btn.querySelector('span').style.color = 'var(--accent-2)';
        }
    } else {
        debugModeEnabled = false;
        if (panel) panel.style.right = '-450px';
        if (btn) {
            btn.style.borderColor = 'var(--border-glass)';
            btn.style.background = 'var(--bg-glass)';
            btn.querySelector('span').style.color = 'var(--text-primary)';
        }
    }
}

// --- Init ---
window.addEventListener('DOMContentLoaded', async () => {
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    newChatBtn.addEventListener('click', startNewChat);
    document.getElementById('authPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleAuth();
    });

    if (authToken) {
        const valid = await verifyToken();
        if (valid) { showApp(); return; }
    }
    showAuth();
});

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// --- Auth ---
function showAuth() {
    authScreen.style.display = 'flex';
    appScreen.classList.add('hidden');
}

function showApp() {
    authScreen.style.display = 'none';
    appScreen.classList.remove('hidden');
    document.getElementById('userInfo').textContent = userEmail;
    loadHistory();
}

function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    document.getElementById('authTitle').textContent = isLoginMode ? 'Sign In' : 'Create Account';
    document.getElementById('authSubmitBtn').textContent = isLoginMode ? 'Sign In' : 'Create Account';
    document.getElementById('authToggleText').textContent = isLoginMode ? "Don't have an account?" : 'Already have an account?';
    document.getElementById('authToggleBtn').textContent = isLoginMode ? ' Sign Up' : ' Sign In';
    document.getElementById('authError').classList.remove('visible');
}

async function handleAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');

    if (!email || !password) {
        errEl.textContent = 'Please enter email and password.';
        errEl.classList.add('visible');
        return;
    }

    const url = isLoginMode ? '/api/login' : '/api/register';
    try {
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await resp.json();

        if (data.success && data.data) {
            authToken = data.data.token;
            userEmail = data.data.email;
            localStorage.setItem('sm_token', authToken);
            localStorage.setItem('sm_email', userEmail);
            errEl.classList.remove('visible');
            showApp();
        } else {
            errEl.textContent = data.error || 'Authentication failed.';
            errEl.classList.add('visible');
        }
    } catch (e) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.add('visible');
    }
}

async function verifyToken() {
    try {
        const resp = await fetch('/api/verify', { headers: authHeaders() });
        const data = await resp.json();
        return data.success === true;
    } catch { return false; }
}

function handleLogout() {
    authToken = '';
    userEmail = '';
    localStorage.removeItem('sm_token');
    localStorage.removeItem('sm_email');
    currentSessionId = crypto.randomUUID();
    msgContainer.innerHTML = '';
    historyList.innerHTML = '';
    showAuth();
}

function authHeaders() {
    return { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' };
}

// --- API helpers ---
async function apiPost(url, body) {
    const res = await fetch(url, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
    return res.json();
}
async function apiGet(url) {
    const res = await fetch(url, { headers: authHeaders() });
    return res.json();
}

// --- History ---
async function loadHistory() {
    try {
        const resp = await apiGet('/api/history');
        if (!resp.success || !resp.data) return;
        renderHistoryList(resp.data);
    } catch (e) { /* silently fail */ }
}

function renderHistoryList(sessions) {
    historyList.innerHTML = '';
    if (!sessions || sessions.length === 0) return;
    sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = 'chat-item' + (s.session_id === currentSessionId ? ' active' : '');
        div.textContent = s.preview || 'New chat';
        div.onclick = () => loadSession(s.session_id);
        historyList.appendChild(div);
    });
}

async function loadSession(sessionId) {
    currentSessionId = sessionId;
    try {
        const resp = await apiGet(`/api/history/${sessionId}`);
        if (!resp.success || !resp.data || resp.data.length === 0) {
            showWelcome(); loadHistory(); return;
        }
        showChatThread();
        msgContainer.innerHTML = '';
        resp.data.forEach(msg => {
            if (msg.role === 'user') appendUserBubble(msg.content);
            else renderResponseCard({ summary: msg.content, sources: msg.sources || [], confidence: msg.confidence || 'medium' });
        });
        scrollToBottom();
        loadHistory();
    } catch (e) { showErrorCard('Failed to load chat history.'); }
}

// --- New Chat ---
async function startNewChat() {
    currentSessionId = crypto.randomUUID();
    showWelcome();
    loadHistory();
    try { await apiPost('/api/new-session', { session_id: currentSessionId }); } catch (e) { /* ok */ }
}

// --- Send Message ---
function initSendingState(text) {
    isLoading = true;
    sendBtn.disabled = true;
    messageInput.value = '';
    messageInput.style.height = 'auto';
    showChatThread();
    appendUserBubble(text);
    scrollToBottom();
    showTypingIndicator();
}

function handleDebugPreSend() {
    clearDebugPanel();
    if (debugModeEnabled) {
        openDebugPanel();
    }
    appendDebug("🔍 Starting request...\n");
    const t1 = setTimeout(() => {
        appendDebug("🔍 Fetching Tavily results...\n");
    }, 300);
    const t2 = setTimeout(() => {
        appendDebug("🧠 Summarizing content...\n");
    }, 1000);
    const t3 = setTimeout(() => {
        appendDebug("✅ Validating answer...\n");
    }, 2000);
    return { t1, t2, t3 };
}

function handleDebugPostSend(resp, timeouts) {
    if (timeouts) {
        clearTimeout(timeouts.t1);
        clearTimeout(timeouts.t2);
        clearTimeout(timeouts.t3);
    }
    if (resp && resp.data && resp.data.debug) {
        const dbg = resp.data.debug;
        appendDebug("\n=== TAVILY RESULTS ===\n");
        renderTavily(dbg.tavily_results);
        appendDebug("\n=== SUMMARIZER OUTPUT ===\n");
        appendDebug((dbg.summarizer_output || "No output") + "\n");
        appendDebug("\n=== VALIDATOR OUTPUT ===\n");
        appendDebug(formatValidator(dbg.validator_output) + "\n");
    } else {
        appendDebug("\n⚠️ No debug data received\n");
    }
}

function finalizeSendingState() {
    isLoading = false;
    sendBtn.disabled = false;
    scrollToBottom();
    loadHistory();
}

async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || isLoading) return;
    if (text.length > 2000) {
        showErrorCard('Message too long. Please keep it under 2000 characters.');
        return;
    }

    initSendingState(text);
    const timeouts = handleDebugPreSend();

    try {
        const resp = await apiPost('/api/chat', { 
            message: text, 
            session_id: currentSessionId,
            debug: true
        });
        removeTypingIndicator();
        if (resp.success && resp.data) {
            renderResponseCard(resp.data);
            handleDebugPostSend(resp, timeouts);
        } else {
            showErrorCard(resp.error || 'Something went wrong.');
            if (timeouts) {
                clearTimeout(timeouts.t1);
                clearTimeout(timeouts.t2);
                clearTimeout(timeouts.t3);
            }
            appendDebug('\n❌ Pipeline failed: ' + (resp.error || 'Unknown error') + '\n');
        }
    } catch (e) {
        removeTypingIndicator();
        showErrorCard('Connection lost. Check your internet.');
        if (timeouts) {
            clearTimeout(timeouts.t1);
            clearTimeout(timeouts.t2);
            clearTimeout(timeouts.t3);
        }
        appendDebug('\n❌ Connection error — pipeline aborted.\n');
    }

    finalizeSendingState();
}

// --- Debug Panel Helpers ---

function openDebugPanel() {
    const panel = document.getElementById('debugDrawer');
    const btn = document.getElementById('debugToggleBtn');
    debugModeEnabled = true;
    if (panel) panel.style.right = '0px';
    if (btn) {
        btn.style.borderColor = 'var(--accent)';
        btn.style.background = 'rgba(139, 92, 246, 0.15)';
        btn.querySelector('span').style.color = 'var(--accent-2)';
    }
}

function clearDebugContent() {
    const container = document.getElementById('debugPanel');
    if (container) container.textContent = '';
}

function clearDebugPanel() {
    clearDebugContent();
}

function appendDebug(text) {
    const panel = document.getElementById("debugPanel");
    if (panel) {
        panel.textContent += text;
        panel.scrollTop = panel.scrollHeight;
    }
}

function renderTavily(results) {
    if (!results || results.length === 0) {
        appendDebug("No Tavily results found.\n");
        return;
    }
    results.forEach((r, idx) => {
        appendDebug(`[${idx + 1}] ${r.title || 'Untitled'}\nURL: ${r.url || ''}\nContent: ${(r.content || '').substring(0, 300)}...\n\n`);
    });
}

function formatValidator(val) {
    if (!val) return "No validator output.\n";
    return `Summary: ${val.summary || ''}\nConfidence: ${val.confidence || ''}\nReason: ${val.reason || ''}\n`;
}

function useSuggestion(text) { messageInput.value = text; sendMessage(); }

// --- UI helpers ---
function showWelcome() { welcomeScreen.classList.remove('hidden'); chatThread.classList.add('hidden'); msgContainer.innerHTML = ''; }
function showChatThread() { welcomeScreen.classList.add('hidden'); chatThread.classList.remove('hidden'); }

function appendUserBubble(text) {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;justify-content:flex-end;margin-bottom:16px;';
    div.className = 'animate-in';
    div.innerHTML = `<div class="user-bubble"><p style="font-size:14px;line-height:1.7;">${escapeHtml(text)}</p></div>`;
    msgContainer.appendChild(div);
}

function renderResponseCard(data) {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;justify-content:flex-start;margin-bottom:24px;';
    div.className = 'animate-in';
    const summaryHtml = escapeHtml(data.summary || '').replace(/\n/g, '<br>');
    const sourcesHtml = buildSourcesHtml(data.sources || []);
    const badgeHtml = buildBadgeHtml(data.confidence || 'medium');
    div.innerHTML = `
        <div class="ai-card">
            <div style="font-size:14px;line-height:1.8;color:var(--text-primary);margin-bottom:16px;">${summaryHtml}</div>
            ${sourcesHtml ? `<div class="divider" style="padding-top:14px;margin-bottom:14px;"><p style="font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Sources</p><div class="sources-row">${sourcesHtml}</div></div>` : ''}
            <div class="divider" style="padding-top:14px;">${badgeHtml}</div>
        </div>`;
    msgContainer.appendChild(div);
    scrollToBottom();
}

function buildSourcesHtml(sources) {
    if (!sources || sources.length === 0) return '';
    return sources.map(s => {
        const domain = getDomain(s.url || '');
        const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=16`;
        return `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener" class="source-chip"><img src="${favicon}" width="14" height="14" alt="" style="border-radius:2px;">${escapeHtml(domain)}</a>`;
    }).join('');
}

function buildBadgeHtml(confidence) {
    const map = {
        high: { bg: 'var(--success)', text: '✅ High Confidence' },
        medium: { bg: 'var(--warning)', text: '⚠️ Medium Confidence' },
        low: { bg: 'var(--danger)', text: '❌ Low Confidence' }
    };
    const c = map[confidence] || map.medium;
    return `<span class="confidence-badge" style="background:${c.bg}15;color:${c.bg};border:1px solid ${c.bg}30;">${c.text}</span>`;
}

function showTypingIndicator() {
    removeTypingIndicator();
    const div = document.createElement('div');
    div.id = 'typingIndicator';
    div.style.cssText = 'display:flex;justify-content:flex-start;margin-bottom:16px;';
    div.className = 'animate-in';
    div.innerHTML = `<div class="ai-card" style="display:flex;align-items:center;gap:14px;padding:16px 20px;"><div style="display:flex;gap:5px;"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div><span id="typingLabel" style="font-size:13px;color:var(--text-secondary);">🔍 Searching the web...</span></div>`;
    msgContainer.appendChild(div);
    scrollToBottom();
    let stage = 0;
    typingInterval = setInterval(() => {
        stage++;
        const label = document.getElementById('typingLabel');
        if (!label) { clearInterval(typingInterval); return; }
        if (stage === 1) label.textContent = '📝 Summarizing results...';
        if (stage === 2) { label.textContent = '✅ Validating answer...'; clearInterval(typingInterval); }
    }, 2500);
}

function removeTypingIndicator() {
    if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

function showErrorCard(msg) {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;justify-content:flex-start;margin-bottom:16px;';
    div.className = 'animate-in';
    div.innerHTML = `<div class="error-card"><p style="font-size:13px;">${escapeHtml(msg)}</p></div>`;
    msgContainer.appendChild(div);
    scrollToBottom();
}

function scrollToBottom() { chatThread.scrollTop = chatThread.scrollHeight; }

function escapeHtml(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function getDomain(url) {
    try { return new URL(url).hostname.replace('www.', ''); } catch { return url; }
}
